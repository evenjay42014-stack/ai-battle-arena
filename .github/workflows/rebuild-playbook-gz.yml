name: rebuild-playbook-gz
on:
  workflow_dispatch:
  push:
    paths:
      - arena/_chunks/play_gz_0.txt
      - arena/_rebuild_playbook_gz.py
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 arena/_rebuild_playbook_gz.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arena/data/playbook.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Rebuild arena/data/playbook.json"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i*2))
          done
          exit 1
